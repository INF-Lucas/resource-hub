name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q skill

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = list(Path("skill").rglob("skill.json"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(paths)} skill.json files")
          PY
