name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q skill

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = list(Path("skill").rglob("skill.json"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(paths)} skill.json files")
          PY
